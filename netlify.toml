[build]
  publish = "."

# Keep private working notes off the public site
[[redirects]]
  from = "/NOTES.md"
  to = "/404.html"
  status = 404
  force = true

# Security headers for every page and file.
# (Netlify already adds Strict-Transport-Security on HTTPS.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://cloud.umami.is https://*.umami.is https://*.umami.dev; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
